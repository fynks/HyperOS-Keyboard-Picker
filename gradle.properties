org.gradle.jvmargs=-Xmx2048m

# Reuses configuration state between builds. Worth it once the Android SDK is
# cached too, since that is the slowest remaining step.
org.gradle.configuration-cache=true
org.gradle.caching=true

# This app is pure Java and declares no dependencies, but AGP adds a default
# kotlin-stdlib dependency, which bundled ~2 MB of unused Kotlin runtime into a
# 14 KB app. Turning it off drops the APK back to ~14 KB.
# If the app ever gains real Kotlin code, remove this line.
kotlin.stdlib.default.dependency=false