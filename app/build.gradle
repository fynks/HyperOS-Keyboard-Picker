import java.util.Properties

plugins { id 'com.android.application' }

// Release signing is configured outside the repository. Create
// ~/keystore.properties (git-ignored, see .gitignore) containing:
//
//   storeFile=/absolute/path/to/keystore.jks
//   storePassword=...
//   keyAlias=...
//   keyPassword=...
//
// Without that file the release build falls back to the debug key, so a fresh
// clone still builds and CI still works - it just produces a debug-signed APK.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}
def hasReleaseKeystore = keystoreProperties.containsKey("storeFile")

android {
    namespace = 'com.fynks.keyboardpicker'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.fynks.keyboardpicker"
        minSdk = 34
        // Android 15 tightened background-activity-launch rules, which looked like a
        // risk to a dialog requested from a cold-start launcher activity. Measured on
        // Android 15 / HyperOS 2.0 that risk does not materialise: 18/18 launches
        // opened the chooser at 35, identical to 34. Held at 35 deliberately rather
        // than 36 - the chooser is the whole app, and 36 is not yet verified on
        // Android 16 hardware.
        targetSdk = 35
        // v1.1.0 shipped with versionCode 5; versionName was left at 1.0.0 by
        // mistake, so the APK disagreed with its own release tag. Corrected here.
        // Keep versionCode in step with versionName - see RELEASING.md.
        versionCode = 6
        versionName = "1.2.0"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            // Falls back to the debug key when no keystore.properties is present, so
            // the project always builds. Once a keystore exists this is signed with
            // it, and successive releases upgrade cleanly over one another - which a
            // CI-generated debug key cannot do.
            signingConfig = hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        abortOnError = true
    }
}