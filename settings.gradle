pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Not redundant: AGP resolves its own aapt2 binary through a detached
// configuration here. Removing this block fails the build with
// "Cannot resolve external dependency com.android.tools.build:aapt2 ... because
// no repositories are defined", even though the app itself has no dependencies.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "KeyboardPicker"
include ":app"