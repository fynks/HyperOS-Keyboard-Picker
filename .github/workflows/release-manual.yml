name: Manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (must match versionName in app/build.gradle, e.g. 2.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # Job-level: a step's own `if` is evaluated before that step's `env` exists.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Install SDK components
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager -path '*bin*' | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under the SDK root"; exit 1; fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;37.0.0"

      - name: Set release tag
        run: echo "RELEASE_TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"

      # Fails if the dispatch input disagrees with versionName, so a manual run
      # can never publish an APK carrying a different version than its tag.
      - name: Validate release version
        run: scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Assert release signing secrets
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::No signing secrets configured. A debug-signed release could" \
               "not upgrade over any previous release. Add the KEYSTORE_* secrets."
          exit 1

      - name: Set up release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signature, checksum and metadata
        id: apk-meta
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools -type f -name apksigner | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK"
          CERT_SHA256=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          SIGNER_DN=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -nE 's/.*certificate DN: (.*)/\1/p' | head -1)
          [ -n "$CERT_SHA256" ] || { echo "::error::could not read signing certificate"; exit 1; }
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "signer_dn=$SIGNER_DN" >> "$GITHUB_OUTPUT"
          (cd app/build/outputs/apk/release && sha256sum app-release.apk | tee app-release.apk.sha256)
          APK="$APK" scripts/check-release-version.sh "$RELEASE_TAG"

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists. Cut a new version instead."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CERT_SHA256: ${{ steps.apk-meta.outputs.cert_sha256 }}
          SIGNER_DN: ${{ steps.apk-meta.outputs.signer_dn }}
        run: |
          NOTES=$(mktemp)
          {
            echo "### What's changed"
            echo
            echo "Full details: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
            echo
            echo "### Requirements"
            echo
            echo "- Android 14 (API 34) or newer"
            echo "- Two or more keyboards enabled, or the chooser will list only one"
            echo "- KernelSU root, for the Quick Settings tile's one-tap keyboard flip"
            echo
            echo "### Install or upgrade"
            echo
            echo '```bash'
            echo "adb install -r app-release.apk"
            echo '```'
            echo
            echo "This release is signed with the project's long-lived release key, so it"
            echo "upgrades over previous releases directly. If the install fails with"
            echo "\`INSTALL_FAILED_UPDATE_INCOMPATIBLE\`, remove the old debug-signed copy first:"
            echo
            echo '```bash'
            echo "adb uninstall com.fynks.keyboardpicker"
            echo '```'
            echo
            echo "### Verify the download"
            echo
            echo '```bash'
            echo "sha256sum -c app-release.apk.sha256   # Linux"
            echo "shasum -a 256 -c app-release.apk.sha256   # macOS"
            echo '```'
            echo
            echo "- Certificate: \`$SIGNER_DN\`"
            echo "- SHA-256 fingerprint: \`$CERT_SHA256\`"
            echo
            echo "### Screenshots"
            echo
            echo "![Quick Settings flip tile](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/tile-swiftkey.png)"
            echo
            echo "![Chooser opening](https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG/chooser.png)"
          } > "$NOTES"
          gh release create "$RELEASE_TAG" \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release.apk.sha256 \
            docs/tile-swiftkey.png \
            docs/chooser.png \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --notes-file "$NOTES"
