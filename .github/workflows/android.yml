name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signature and checksum
        run: |
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk | tee app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.apk.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ### Install

          ```bash
          adb install -r app-release.apk
          ```

          ### A note on signing

          This APK is signed with the debug key generated by the CI runner. That
          key is ephemeral: every CI run produces a *different* signature, so a
          later CI build will not upgrade over an earlier one and will fail with
          `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Remove the previous copy first:

          ```bash
          adb uninstall com.fynks.keyboardpicker
          ```

          Builds produced locally on one machine share a stable key and do
          upgrade cleanly, as long as you keep using that machine.
          EOF
          )"

# To make CI releases upgradable over each other, add a keystore to repository
# secrets and point build.gradle's release signingConfig at it. Until then the
# debug key above is used.