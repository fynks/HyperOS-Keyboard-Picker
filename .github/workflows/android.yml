name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cert_sha256: ${{ steps.apk-meta.outputs.cert_sha256 }}
      signer_dn: ${{ steps.apk-meta.outputs.signer_dn }}

    # Job-level, not step-level: a step's own `if` is evaluated before that
    # step's `env` exists, so `if: env.KEYSTORE_BASE64 != ''` on a step that
    # defines KEYSTORE_BASE64 is always false and the step never runs.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Restore the cache BEFORE installing SDK components, otherwise the install
      # always pays the full download and the cache is only ever written.
      #
      # Only the two components this project uses are cached, not the SDK root:
      # the root also holds emulator and system images (10+ GB), which made the
      # post-job upload the slowest step in the build.
      #
      # continue-on-error: a cache miss or a cache-service outage must never fail
      # the build. This is purely an optimisation; sdkmanager re-downloads below.
      - name: Restore cached SDK components
        uses: actions/cache@v6
        continue-on-error: true
        id: sdk-cache
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/platforms/android-36
            ${{ env.ANDROID_SDK_ROOT || '/usr/local/lib/android/sdk' }}/build-tools/37.0.0
          key: android-sdk-${{ runner.os }}-api36-bt37-${{ hashFiles('app/build.gradle') }}

      # The SDK ships with the runner image but sdkmanager is not on PATH, so locate
      # it rather than depending on setup-android (which fails on `sdkmanager
      # tools`, an obsolete package) or a hardcoded image path. This installs only
      # what the cache did not supply, and succeeds either way.
      - name: Install SDK components
        run: |
          SDKMANAGER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager -path '*bin*' | head -1)
          if [ -z "$SDKMANAGER" ]; then echo "::error::sdkmanager not found under the SDK root"; exit 1; fi
          echo "sdkmanager: $SDKMANAGER"
          echo "cache hit  : ${{ steps.sdk-cache.outputs.cache-hit }}"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;37.0.0"

      # Guards against a tag that disagrees with the Gradle version, and against an
      # APK whose own metadata drifted from the build files. On branches and pull
      # requests the tag comparison is skipped, so development builds are unaffected.
      - name: Validate release version
        run: scripts/check-release-version.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - name: Report signing configuration
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Signing secrets present - release key will be used." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::No signing secrets configured; this build falls back to the" \
                 "ephemeral debug key and cannot upgrade over any other CI build." \
                 >> "$GITHUB_STEP_SUMMARY"
          fi

      # Reconstruct the release keystore. Build tools are addressed by full path
      # because build-tools/<ver> is not guaranteed to be on PATH.
      - name: Set up release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Never leave the properties file behind for later steps or the artifact.
          echo "keystore.properties" >> "$GITHUB_STEP_SUMMARY"

      - name: Build release APK
        run: ./gradlew assembleRelease

      # Fail loudly if a tagged release was not signed with the real key: a
      # debug-signed release cannot upgrade over the previous one.
      - name: Assert release signing on tags
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Tagged release built without signing secrets. It would be" \
               "signed with an ephemeral debug key and could not upgrade over any" \
               "previous release. Add the KEYSTORE_* secrets, or build locally."
          exit 1

      - name: Verify signature and checksum
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk | tee app-release.apk.sha256

      # Re-runs the version check, this time against the real APK, so the built
      # artifact is proven to carry the version the tag claims.
      - name: Validate built APK metadata
        id: apk-meta
        run: |
          APKSIGNER=$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools -type f -name apksigner | sort -V | tail -1)
          CERT_SHA256=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          [ -n "$CERT_SHA256" ] || { echo "::error::could not read signing certificate"; exit 1; }
          SIGNER_DN=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk \
            | sed -nE 's/.*certificate DN: (.*)/\1/p' | head -1)
          # Job outputs, so the release job can quote the real certificate.
          echo "cert_sha256=$CERT_SHA256" >> "$GITHUB_OUTPUT"
          echo "signer_dn=$SIGNER_DN" >> "$GITHUB_OUTPUT"
          APK=app/build/outputs/apk/release/app-release.apk \
            scripts/check-release-version.sh "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

      - uses: actions/upload-artifact@v7
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk*
          if-no-files-found: error

      - name: Report signing certificate
        run: |
          {
            echo "### Signing certificate"
            echo
            echo '```'
            $(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}"/build-tools -type f -name apksigner | sort -V | tail -1) \
              verify --print-certs \
              app/build/outputs/apk/release/app-release.apk \
              | grep -E "certificate DN|certificate SHA-256 digest"
            echo '```'
            echo
            echo "Keystore file is not included in this artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-release
          path: dist

      # `gh release create` infers the target repository from the local git
      # checkout. This job deliberately has none - it only downloads the built
      # artifact - so gh failed with "fatal: not a git repository". GH_REPO tells
      # gh where to publish instead, avoiding a full checkout just to name a repo.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CERT_SHA256: ${{ needs.build.outputs.cert_sha256 }}
          SIGNER_DN: ${{ needs.build.outputs.signer_dn }}
        run: |
          NOTES=$(mktemp)
          {
            echo "### What's changed"
            echo
            echo "Full details: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
            echo "The commit list for this tag is below."
            echo
            echo "### Requirements"
            echo
            echo "- Android 14 (API 34) or newer"
            echo "- Two or more keyboards enabled, or the chooser will list only one"
            echo
            echo "### Install or upgrade"
            echo
            echo '```bash'
            echo "adb install -r app-release.apk"
            echo '```'
            echo
            echo "This release is signed with the project's long-lived release key, so it"
            echo "upgrades over previous releases directly."
            echo
            echo 'If the install fails with `INSTALL_FAILED_UPDATE_INCOMPATIBLE`, the copy on'
            echo "the device was signed with a *different* key (an early debug-signed build,"
            echo "or one from another machine). Remove it first:"
            echo
            echo '```bash'
            echo "adb uninstall com.fynks.keyboardpicker"
            echo '```'
            echo
            echo "### Verify the download"
            echo
            echo "Check the APK against the published checksum (Linux and macOS):"
            echo
            echo '```bash'
            echo "sha256sum -c app-release.apk.sha256   # Linux"
            echo "shasum -a 256 -c app-release.apk.sha256   # macOS"
            echo '```'
            echo
            echo "To confirm an installed APK really is an official build, compare its"
            echo "signing certificate with this release's:"
            echo
            echo '```bash'
            echo "apksigner verify --print-certs app-release.apk | grep 'certificate SHA-256'"
            echo '```'
            echo
            echo "- Certificate: \`${{ env.SIGNER_DN }}\`"
            echo "- SHA-256 fingerprint: \`${{ env.CERT_SHA256 }}\`"
            echo
            echo "The certificate fingerprint is a property of the signing key. The APK"
            echo "checksum changes with every rebuild; the fingerprint does not."
          } > "$NOTES"
          gh release create "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.apk.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$NOTES"