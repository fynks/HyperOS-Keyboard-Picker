name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          $ANDROID_HOME/build-tools/*/apksigner verify \
            app/build/outputs/apk/release/app-release.apk

      - name: Checksum
        run: |
          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          cat app-release.apk.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/app-release.apk
            dist/app-release.apk.sha256
          generate_release_notes: true
          body: |
            ### Installing

            ```
            adb install -r app-release.apk
            ```

            This build is signed with a **debug key**. If you already have an
            earlier build of this app installed from a different machine, the
            signatures will not match and the install will fail with
            `INSTALL_FAILED_UPDATE_INCOMPATIBLE`. Remove the old copy first:

            ```
            adb uninstall com.fynks.keyboardpicker
            ```