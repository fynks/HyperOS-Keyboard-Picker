name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v3

      # Reconstruct the release keystore from secrets. Without these, the build
      # falls back to the debug key and each CI run produces a different signature,
      # so releases cannot upgrade over one another.
      - name: Set up release keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Verify signature and checksum
        run: |
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          cd app/build/outputs/apk/release
          sha256sum app-release.apk | tee app-release.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk*
          if-no-files-found: error

      - name: Report signing key
        run: |
          {
            echo "### Signing key"
            echo
            echo '```'
            apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk \
              | grep -E "certificate DN|certificate SHA-256 digest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/app-release.apk dist/app-release.apk.sha256 \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "$(cat <<'EOF'
          ### Install

          ```bash
          adb install -r app-release.apk
          ```

          ### A note on signing

          If this release was published by CI with signing secrets configured, it is
          signed with a long-lived release key and will upgrade cleanly over previous
          releases. If no signing secrets were configured, the APK falls back to the
          debug key generated for that individual CI run; such a build has a
          different signature to every other one and cannot upgrade over it. If an
          install fails with `INSTALL_FAILED_UPDATE_INCOMPATIBLE`, remove the old
          copy first:

          ```bash
          adb uninstall com.fynks.keyboardpicker
          ```

          The exact signing certificate is printed in this workflow's summary.
          EOF
          )"